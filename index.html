<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Naresh — Software Developer | AI & Backend Developer</title>
    <meta name="description" content="Naresh is a Software Developer specializing in AI-powered applications, backend systems, and scalable software architecture." />
    <meta name="keywords" content="Software Developer, AI Developer, Backend Developer, Python, Java, FastAPI, Machine Learning, System Design" />
    <meta name="author" content="Naresh" />

    <!-- Open Graph -->
    <meta property="og:title" content="Naresh — Software Developer | AI & Backend Developer" />
    <meta property="og:description" content="Building intelligent systems and scalable software." />
    <meta property="og:type" content="website" />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://dl.polyhaven.org" />

    <!-- Google Fonts — display=swap ensures text is visible immediately with fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Preload the hero profile photo for faster LCP -->
    <link rel="preload" href="/naresh.jpg" as="image" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
